site_name: Sennit
site_description: A terminal-first AI coding agent with real multi-agent orchestration.
site_url: https://rave-soft.github.io/sennit/
repo_url: https://github.com/rave-soft/sennit
repo_name: rave-soft/sennit
edit_uri: edit/main/docs/
copyright: FSL-1.1-MIT

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration:
      - configuration/index.md
      - sennitrc reference: configuration/sennitrc.md
      - Providers and models: configuration/providers.md
      - Context files: configuration/context.md
      - Permissions: configuration/permissions.md
      - Environment and paths: configuration/environment.md
      - Legacy JSON: configuration/json.md
      - Future work: configuration/future.md
  - Extending:
      - extending/index.md
      - Agents: extending/agents.md
      - Skills: extending/skills.md
      - Commands: extending/commands.md
      - Hooks: extending/hooks.md
      - Hooks, future work: extending/hooks-future.md
      - MCP: extending/mcp.md
      - LSP: extending/lsp.md
  - Concepts:
      - concepts/index.md
      - Steering, tasks and threads: concepts/delegation.md
      - Sessions and data storage: concepts/sessions.md
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Terminal UI: reference/tui.md
      - Built-in tools: reference/tools.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - github-callouts # renders GitHub-style "> [!NOTE]" blocks as admonitions
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
