# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
#
# Deliberately small. This config needs nothing but the GITHUB_TOKEN that
# Actions hands every job: it builds, archives, checksums and publishes a
# GitHub release, and stops there.
#
# The package-manager channels this file used to carry (Homebrew, Scoop,
# AUR, nix, winget, npm, Fury, deb/rpm) were inherited from upstream and
# pointed at repositories, accounts and secrets that do not exist for this
# project — every one of them would fail the release rather than skip. They
# come back one at a time, each with its repository and token in place.
# Anything Pro-only (nightly, includes.from_url, furies, npms, aur_sources)
# stays out so this runs on the free goreleaser.
version: 2

project_name: sennit

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run . completion bash >./completions/sennit.bash'
    - sh -c 'go run . completion zsh >./completions/sennit.zsh'
    - sh -c 'go run . completion fish >./completions/sennit.fish'
    - sh -c 'go run . man | gzip -c >./manpages/sennit.1.gz'

builds:
  - env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rave-soft/sennit/internal/version.Version={{.Version}}
      - -X github.com/rave-soft/sennit/internal/version.Commit={{.FullCommit}}
    flags:
      - -trimpath

archives:
  - name_template: >-
      sennit_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - NOTICE
      - manpages/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

source:
  enabled: true

changelog:
  sort: asc
  # git, not github: `use: github` asks the API to compare the previous
  # tag with this one, and that request 404s for this repository — twice,
  # identically, on v0.1.1. It had never actually run before: v0.1.0 was
  # the first tag, so goreleaser had nothing to compare against and fell
  # back to the git log, which is why the notes it published carry the
  # "<sha>: <subject> (<author>)" shape this setting produces.
  #
  # Reading the local history is also what the rest of the release path
  # already assumes: release.yml clones with fetch-depth: 0 precisely so
  # the range since the previous tag is present, and says so. Keeping the
  # changelog off the network means one less thing that can fail after an
  # eight-minute build has already succeeded.
  use: git
  filters:
    exclude:
      - "^(build|ci): "
      - "^chore: auto-update generated files$"
      - "^chore: docs$"
      - "^chore: schema update$"
      - "^chore: schema$"
      - "^chore: typo$"
      - "^chore: update schema$"
      - "^chore: update$"
      - "^chore\\(legal\\): "
      - "^chore\\(deps\\): "
      - "^docs: update$"
      - "^test:"
      - "^test\\("
      - "^v\\d.*"
      - "merge conflict"
      - Merge branch
      - Merge pull request
      - Merge remote-tracking branch
      - go mod tidy
      - "^wip "
      - "^wip:"
  groups:
    - title: "Deps"
      regexp: "^.*\\(deps\\)*:+.*$"
      order: 300
    - title: "New!"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Fixed"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Docs"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: "Other stuff"
      order: 9999

release:
  prerelease: auto
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/rave-soft/sennit/main/scripts/install.sh | sh
    ```

    Or download an archive below. macOS binaries are **not** signed or
    notarized: Gatekeeper quarantines a downloaded archive, and the first
    run needs `xattr -d com.apple.quarantine /path/to/sennit`.
