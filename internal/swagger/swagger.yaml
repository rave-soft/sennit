        type: string
    type: object
  proto.SkillDiscoveryState:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - SkillStateNormal
    - SkillStateError
  proto.SkillInfo:
    properties:
      description:
        type: string
      id:
        type: string
      label:
        type: string
      name:
        type: string
