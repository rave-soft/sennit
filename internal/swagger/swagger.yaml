    type: object
  proto.Thread:
    properties:
      base_branch:
        type: string
      branch:
        type: string
      completed_at:
        type: integer
      created_at:
        type: integer
      error:
        type: string
      goal:
        type: string
      id:
        type: string
      merge_policy:
        type: string
      name:
        type: string
      result_summary:
        type: string
      session_id:
        type: string
      status:
        type: string
      updated_at:
        type: integer
      workspace_id:
        description: |-
          WorkspaceID is the runtime workspace ID of the thread's currently
          spawned isolated workspace (see internal/thread.Manager.WorkspaceID),
          empty when the thread's workspace is not currently spawned (e.g.
          completed/merged/failed, or interrupted and not yet resumed).
        type: string
      worktree_path:
        type: string
    type: object
  proto.Todo:
    properties:
      active_form:
        type: string
      content:
        type: string
      status:
        type: string
    type: object
  proto.VersionInfo:
    properties:
      build_id:
        type: string
      commit:
        type: string
      go_version:
        type: string
      platform:
        type: string
      version:
        type: string
    type: object
  proto.Workspace:
    properties:
      channels:
        description: |-
          Channels lists the MCP servers opted in as channels for this workspace
          (from the --channels flag).
        items:
          type: string
        type: array
      client_id:
        type: string
      config:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Config'
      data_dir:
        type: string
      debug:
        type: boolean
      env:
        items:
          type: string
        type: array
      id:
        type: string
      path:
        type: string
      skills:
        description: |-
          Skills carries the snapshot of skill discovery state at workspace
          creation time. Subsequent updates flow through the SSE event
          stream.
        items:
          $ref: '#/definitions/proto.SkillState'
        type: array
      threads_supported:
        description: |-
          ThreadsSupported reports whether this workspace has a thread
          manager attached (i.e. it is rooted at a git repository and not
          itself a thread's nested workspace). The server sets this field
          based on attachServerThreads; the client seeds its local cache
          from it, avoiding a live probe at construction time. A nil value
          means the server predates this field and the client must perform
          a single fallback probe in a controlled point (not the hot path).
        type: boolean
      version:
        type: string
      yolo:
        type: boolean
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
