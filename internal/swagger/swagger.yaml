basePath: /v1
definitions:
  catwalk.Model:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      id:
        type: string
      name:
        type: string
      options:
        $ref: '#/definitions/catwalk.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      supports_attachments:
        type: boolean
    type: object
  catwalk.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.Agent:
    properties:
      allowed_mcp:
        additionalProperties:
          items:
            type: string
          type: array
        description: |-
          this tells us which MCPs are available for this agent
           if this is empty all mcps are available
           the string array is the list of tools from the AllowedMCP the agent has available
           if the string array is nil, all tools from the AllowedMCP are available
        type: object
      allowed_tools:
        description: |-
          The available tools for the agent
           if this is nil, all tools are available
        items:
          type: string
        type: array
      context_paths:
        description: Overrides the context paths for this agent
        items:
          type: string
        type: array
      description:
        type: string
      disabled:
        description: This is the id of the system prompt used by the agent
        type: boolean
      id:
        type: string
      model:
        description: |-
          Model optionally pins this agent to a specific "provider/model-id",
          letting a sub-agent use a model other agents don't. Left empty, the
          agent inherits the application's main model. A value that does not
          resolve to a known provider/model falls back to the empty default
          with a warning logged.
        type: string
      name:
        type: string
      prompt:
        description: |-
          Prompt is the system prompt for this agent. User-defined agents must
          set it; the built-in coder and task agents leave it empty and fall back
          to their embedded templates.
        type: string
      reasoning_effort:
        description: |-
          ReasoningEffort overrides the selected model's effort for this agent, so
          a cheap reviewer and a deep implementer can share one model. An effort
          the model does not offer is ignored at call time in favour of the
          model's own default; the enum below lists the common levels, but any
          level the model advertises is accepted.
        type: string
    type: object
  config.Attribution:
    properties:
      co_authored_by:
        type: boolean
      generated_with:
        type: boolean
      trailer_style:
        $ref: '#/definitions/config.TrailerStyle'
    type: object
  config.Completions:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      name:
        description: Friendly display name shown in the TUI. Falls back to Command
          when empty.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  config.LSPs:
    additionalProperties:
      $ref: '#/definitions/config.LSPConfig'
    type: object
  config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      oauth:
        description: |-
          OAuth enables the MCP OAuth 2.1 authorization flow for HTTP
          transport servers. When true, the client uses dynamic client
          registration and opens a browser for the user to authorize.
          Tokens are persisted automatically. Only supported for type=http.
        type: boolean
      oauth_callback_port:
        description: |-
          OAuthCallbackPort pins the localhost port used for the OAuth
          redirect listener. Set this when the OAuth provider requires an
          exact-match callback URL (e.g. GitHub OAuth Apps). When omitted,
          Braid picks the first free port from its default range.
        type: integer
      oauth_client_id:
        description: |-
          OAuthClientID is an optional pre-registered OAuth client ID. Set
          it for servers that do not support dynamic client registration
          (e.g. GitHub, Slack) and instead issue client credentials when you
          register an OAuth app. Values run through shell expansion, so
          $VAR and $(cmd) work.
        type: string
      oauth_client_secret:
        description: |-
          OAuthClientSecret is the optional secret paired with
          OAuthClientID for confidential clients. Values run through shell
          expansion, so $VAR and $(cmd) work.
        type: string
      oauth_token:
        allOf:
        - $ref: '#/definitions/oauth.Token'
        description: |-
          OAuthToken is the persisted OAuth token for this server. It is
          managed internally and stored in the global data config.
      timeout:
        type: integer
      type:
        $ref: '#/definitions/config.MCPType'
      url:
        type: string
    type: object
  config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  config.MCPs:
    additionalProperties:
      $ref: '#/definitions/config.MCPConfig'
    type: object
  config.Permissions:
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      bypass:
        description: |-
          Bypass, when true, skips every permission prompt from process start —
          equivalent to always-on yolo mode. It is the persistent counterpart to
          the session-only --yolo flag / ctrl+y toggle (see permission.Service.
          SetSkipRequests), which continue to work as a runtime override on top
          of this.
        type: boolean
    type: object
  config.SelectedModel:
    properties:
      frequency_penalty:
        type: number
      max_tokens:
        description: Overrides the default model configuration.
        type: integer
      model:
        description: |-
          The model id as used by the provider API.
          Required.
        type: string
      presence_penalty:
        type: number
      provider:
        description: |-
          The model provider, same as the key/id used in the providers config.
          Required.
        type: string
      provider_options:
        additionalProperties: {}
        description: Override provider specific options.
        type: object
      reasoning_effort:
        description: Only used by models that use the openai provider and need this
          set.
        type: string
      temperature:
        type: number
      think:
        description: Used by anthropic models that can reason to indicate if the model
          should think.
        type: boolean
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.TUIOptions:
    properties:
      compact_mode:
        type: boolean
      completions:
        $ref: '#/definitions/config.Completions'
      diff_mode:
        type: string
      keybindings:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      scrollbar:
        type: string
      transparent:
        type: boolean
    type: object
  config.ThreadsOptions:
    properties:
      worktree_dir:
        description: |-
          WorktreeDir is the parent directory under which each thread's git
          worktree is created (at <worktree_dir>/<thread-name>). A relative
          path is resolved against the parent of the repository root (the
          same directory the default sibling "<repo>-threads" lives in), not
          against the working directory. Absolute paths are used as-is.
          Defaults to a "<repo>-threads" sibling of the repository root.
        type: string
    type: object
  config.ToolGlob:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  config.ToolGrep:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  config.ToolLs:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.Tools:
    properties:
      glob:
        $ref: '#/definitions/config.ToolGlob'
      grep:
        $ref: '#/definitions/config.ToolGrep'
      ls:
        $ref: '#/definitions/config.ToolLs'
    type: object
  config.TrailerStyle:
    enum:
    - none
    - co-authored-by
    - assisted-by
    type: string
    x-enum-varnames:
    - TrailerStyleNone
    - TrailerStyleCoAuthoredBy
    - TrailerStyleAssistedBy
  config.WebSearchOptions:
    properties:
      api_key:
        description: |-
          APIKey authenticates with the selected provider. Runs through shell
          expansion at tool-build time, the same as provider api_key, so $VAR
          and $(cmd) work. Unused by the duckduckgo provider.
        type: string
      base_url:
        description: |-
          BaseURL overrides the provider's default API endpoint, for
          self-hosted or proxy-compatible search APIs.
        type: string
      provider:
        description: |-
          Provider selects the search backend. "duckduckgo" (default) scrapes
          DuckDuckGo Lite and needs no API key; "tavily" calls the Tavily
          Search API and requires APIKey.
        type: string
      proxy_url:
        description: |-
          ProxyURL routes web search requests through a proxy. Web search has
          no LLM provider of its own to inherit proxy_url from, so it is
          configured here; same semantics as ProviderConfig.ProxyURL,
          including the "none" sentinel and shell expansion.
        type: string
    type: object
  csync.Map-string-config_ProviderConfig:
    type: object
  git.FileChange:
    properties:
      additions:
        type: integer
      deletions:
        type: integer
      path:
        type: string
    type: object
  github_com_rave-soft_braid_internal_config.Config:
    properties:
      $schema:
        type: string
      agents:
        additionalProperties:
          $ref: '#/definitions/config.Agent'
        description: |-
          Agents holds both the built-in agents and any the user defines.
          SetupAgents populates this from .braid/agents/*.md files (via
          discoverMarkdownAgents) plus the two built-ins; nothing decodes user
          agents into this field from JSON anymore (see loadFromBytes in
          load.go), so it is hidden from the generated config schema.
        type: object
      env:
        additionalProperties:
          type: string
        description: Env is a map of environment variables set on startup.
        type: object
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/config.HookConfig'
          type: array
        type: object
      lsp:
        $ref: '#/definitions/config.LSPs'
      mcp:
        $ref: '#/definitions/config.MCPs'
      model:
        allOf:
        - $ref: '#/definitions/config.SelectedModel'
        description: Model is the single model Braid uses for the session.
      options:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Options'
      permissions:
        $ref: '#/definitions/config.Permissions'
      providers:
        allOf:
        - $ref: '#/definitions/csync.Map-string-config_ProviderConfig'
        description: The providers that are configured
      recent_models:
        description: |-
          RecentModels lists recently used models, most-recent-first. Stored
          in the data directory config.
        items:
          $ref: '#/definitions/config.SelectedModel'
        type: array
      tools:
        $ref: '#/definitions/config.Tools'
    type: object
  github_com_rave-soft_braid_internal_config.Options:
    properties:
      attribution:
        $ref: '#/definitions/config.Attribution'
      auto_lsp:
        type: boolean
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is a project-local directory (".braid" by default) for
          workspace-scoped state that is NOT part of the shared global database:
          the single-instance lock file, workspace config overrides, and (until
          imported) a pre-shared-database project's legacy braid.db. Session and
          message history now live in the single global database (see
          config.GlobalDBDir()), not here. Relative paths are resolved against
          the working directory; absolute paths are used verbatim. After
          defaulting the stored value is always absolute.
        type: string
      debug:
        type: boolean
      debug_lsp:
        type: boolean
      disable_auto_summarize:
        type: boolean
      disable_default_providers:
        type: boolean
      disable_metrics:
        type: boolean
      disabled_skills:
        items:
          type: string
        type: array
      disabled_tools:
        items:
          type: string
        type: array
      global_context_paths:
        items:
          type: string
        type: array
      history_retention_days:
        description: |-
          HistoryRetentionDays is read by `braid gc`, not enforced automatically:
          nothing purges history on its own. A pointer distinguishes "unset"
          (defaults to 90) from an explicit 0, which means keep history forever.
        type: integer
      initialize_as:
        type: string
      notifications:
        type: string
      progress:
        type: boolean
      skills_paths:
        items:
          type: string
        type: array
      threads:
        $ref: '#/definitions/config.ThreadsOptions'
      tui:
        $ref: '#/definitions/config.TUIOptions'
      web_search:
        $ref: '#/definitions/config.WebSearchOptions'
    type: object
  github_com_rave-soft_braid_internal_config.Scope:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - ScopeGlobal
    - ScopeWorkspace
  github_com_rave-soft_braid_internal_proto.Message:
    properties:
      created_at:
        type: integer
      id:
        type: string
      model:
        type: string
      parts:
        items: {}
        type: array
      provider:
        type: string
      role:
        $ref: '#/definitions/proto.MessageRole'
      session_id:
        type: string
      updated_at:
        type: integer
    type: object
  lsp.ServerState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-varnames:
    - StateUnstarted
    - StateStarting
    - StateReady
    - StateError
    - StateStopped
    - StateDisabled
  oauth.OAuthClient:
    properties:
      auth_style:
        type: integer
      auth_url:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      token_url:
        type: string
    type: object
  oauth.Token:
    properties:
      access_token:
        type: string
      client:
        $ref: '#/definitions/oauth.OAuthClient'
      expires_at:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  proto.APIKeyKind:
    enum:
    - string
    - oauth
    type: string
    x-enum-varnames:
    - APIKeyKindString
    - APIKeyKindOAuth
  proto.AgentInfo:
    properties:
      is_busy:
        type: boolean
      is_ready:
        type: boolean
      model:
        $ref: '#/definitions/catwalk.Model'
      model_cfg:
        $ref: '#/definitions/config.SelectedModel'
    type: object
  proto.AgentMessage:
    properties:
      attachments:
        items:
          $ref: '#/definitions/proto.Attachment'
        type: array
      prompt:
        type: string
      run_id:
        type: string
      session_id:
        type: string
    type: object
  proto.AgentSession:
    properties:
      attached_clients:
        type: integer
      completion_tokens:
        type: integer
      cost:
        type: number
      created_at:
        type: integer
      id:
        type: string
      is_busy:
        type: boolean
      message_count:
        type: integer
      parent_session_id:
        type: string
      prompt_tokens:
        type: integer
      summary_message_id:
        type: string
      title:
        type: string
      todos:
        items:
          $ref: '#/definitions/proto.Todo'
        type: array
      updated_at:
        type: integer
    type: object
  proto.Attachment:
    properties:
      content:
        items:
          type: integer
        type: array
      file_name:
        type: string
      file_path:
        type: string
      mime_type:
        type: string
    type: object
  proto.ConfigCompactRequest:
    properties:
      enabled:
        type: boolean
      scope:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Scope'
    type: object
  proto.ConfigModelRequest:
    properties:
      model:
        $ref: '#/definitions/config.SelectedModel'
      scope:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Scope'
    type: object
  proto.ConfigProviderKeyRequest:
    properties:
      api_key:
        items:
          type: integer
        type: array
      kind:
        $ref: '#/definitions/proto.APIKeyKind'
      provider_id:
        type: string
      scope:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Scope'
    type: object
  proto.ConfigRefreshOAuthRequest:
    properties:
      provider_id:
        type: string
      scope:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Scope'
    type: object
  proto.ConfigRemoveRequest:
    properties:
      key:
        type: string
      scope:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Scope'
    type: object
  proto.ConfigSetRequest:
    properties:
      key:
        type: string
      scope:
        $ref: '#/definitions/github_com_rave-soft_braid_internal_config.Scope'
      value: {}
    type: object
  proto.CreateThreadRequest:
    properties:
      base_branch:
        type: string
      goal:
        type: string
      merge_policy:
        type: string
      name:
        type: string
    type: object
  proto.CurrentSession:
    properties:
      generation:
        type: integer
      session_id:
        type: string
    type: object
  proto.Error:
    properties:
      message:
        type: string
    type: object
  proto.File:
    properties:
      content:
        type: string
      created_at:
        type: integer
      id:
        type: string
      path:
        type: string
      session_id:
        type: string
      updated_at:
        type: integer
      version:
        type: integer
    type: object
  proto.FileTrackerReadRequest:
    properties:
      path:
        type: string
      session_id:
        type: string
    type: object
  proto.ImportCopilotResponse:
    properties:
      success:
        type: boolean
      token: {}
    type: object
  proto.LSPClientInfo:
    properties:
      connected_at:
        type: string
      diagnostic_count:
        type: integer
      error: {}
      name:
        type: string
      state:
        $ref: '#/definitions/lsp.ServerState'
    type: object
  proto.LSPStartRequest:
    properties:
      path:
        type: string
    type: object
  proto.MCPAuthResponse:
    properties:
      auth_url:
        description: |-
          AuthURL is the OAuth authorization URL the user must visit, when
          the flow is still in progress.
        type: string
    type: object
  proto.MCPClientInfo:
    properties:
      connected_at:
        type: string
      error: {}
      name:
        type: string
      prompt_count:
        type: integer
      resource_count:
        type: integer
      state:
        $ref: '#/definitions/proto.MCPState'
      tool_count:
        type: integer
    type: object
  proto.MCPGetPromptRequest:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      client_id:
        type: string
      prompt_id:
        type: string
    type: object
  proto.MCPGetPromptResponse:
    properties:
      prompt:
        type: string
    type: object
  proto.MCPNameRequest:
    properties:
      name:
        type: string
    type: object
  proto.MCPPendingAuthServer:
    properties:
      name:
        type: string
      url:
        type: string
    type: object
  proto.MCPPrompt:
    properties:
      arguments:
        items:
          $ref: '#/definitions/proto.MCPPromptArgument'
        type: array
      client_id:
        type: string
      description:
        type: string
      id:
        type: string
      prompt_id:
        type: string
      title:
        type: string
    type: object
  proto.MCPPromptArgument:
    properties:
      description:
        type: string
      id:
        type: string
      required:
        type: boolean
      title:
        type: string
    type: object
  proto.MCPReadResourceRequest:
    properties:
      name:
        type: string
      uri:
        type: string
    type: object
  proto.MCPResource:
    properties:
      mcp_name:
        type: string
      mime_type:
        type: string
      title:
        type: string
      uri:
        type: string
    type: object
  proto.MCPState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - MCPStateDisabled
    - MCPStateStarting
    - MCPStateConnected
    - MCPStateError
    - MCPStateNeedsAuth
  proto.MessageRole:
    enum:
    - assistant
    - user
    - system
    - tool
    - assistant
    - user
    - system
    - tool
    type: string
    x-enum-varnames:
    - Assistant
    - User
    - System
    - Tool
  proto.PermissionAction:
    enum:
    - allow
    - allow_session
    - deny
    type: string
    x-enum-varnames:
    - PermissionAllow
    - PermissionAllowForSession
    - PermissionDeny
  proto.PermissionGrant:
    properties:
      action:
        $ref: '#/definitions/proto.PermissionAction'
      permission:
        $ref: '#/definitions/proto.PermissionRequest'
    type: object
  proto.PermissionGrantResponse:
    properties:
      resolved:
        type: boolean
    type: object
  proto.PermissionRequest:
    properties:
      action:
        type: string
      description:
        type: string
      id:
        type: string
      params: {}
      path:
        type: string
      session_id:
        type: string
      tool_call_id:
        type: string
      tool_name:
        type: string
    type: object
  proto.PermissionSkipRequest:
    properties:
      skip:
        type: boolean
    type: object
  proto.ProjectInitPromptResponse:
    properties:
      prompt:
        type: string
    type: object
  proto.ProjectNeedsInitResponse:
    properties:
      needs_init:
        type: boolean
    type: object
  proto.QuestionAnswer:
    properties:
      batch_request_id:
        type: string
      responses:
        items:
          $ref: '#/definitions/proto.QuestionResponse'
        type: array
    type: object
  proto.QuestionAnswerResponse:
    properties:
      resolved:
        type: boolean
    type: object
  proto.QuestionResponse:
    properties:
      fill_in_text:
        type: string
      notes:
        additionalProperties:
          type: string
        type: object
      request_id:
        type: string
      selected_ids:
        items:
          type: string
        type: array
      "yes":
        type: boolean
    type: object
  proto.ReadSkillRequest:
    properties:
      skill_id:
        type: string
    type: object
  proto.ReadSkillResponse:
    properties:
      content:
        items:
          type: integer
        type: array
      result:
        $ref: '#/definitions/proto.SkillReadResult'
    type: object
  proto.SendThreadRequest:
    properties:
      message:
        type: string
    type: object
