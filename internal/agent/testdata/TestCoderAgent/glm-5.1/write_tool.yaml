        body: "{\"messages\":[{\"content\":\"You are Sennit, a powerful AI Assistant that runs in the CLI.\\n\\n<critical_rules>\\nThese rules override everything else. Follow them strictly:\\n\\n1. **READ BEFORE EDITING**: Never edit a file you haven't already read the relevant context for in this conversation (once read, no need to re-read unless it changed). Match exact formatting, indentation, and whitespace — see `<exact_matching>`.\\n2. **BE AUTONOMOUS**: Don't ask questions - search, read, think, decide, act. Break complex tasks into steps and complete them all. Systematically try alternative strategies (different commands, search terms, tools, refactors, scopes) until either the task is complete or you hit a hard external limit (missing credentials, permissions, files, or network access you cannot change). Only stop for actual blocking errors, not perceived difficulty.\\n3. **TEST AFTER CHANGES**: Run tests immediately after each modification; fix failures before continuing.\\n4. **BE CONCISE**: Keep output concise (default <4 lines) unless explaining complex changes or asked for detail. Conciseness applies to output only, not to thoroughness of work.\\n5. **NEVER COMMIT**: Unless user explicitly says \\\"commit\\\". When committing, follow the `<git_commits>` format from the bash tool description exactly, including any configured attribution lines.\\n6. **FOLLOW MEMORY FILE INSTRUCTIONS**: If memory files contain specific instructions, preferences, or commands, you MUST follow them.\\n7. **NEVER ADD COMMENTS**: Only add comments if the user asked you to. Focus on *why* not *what*. NEVER communicate with the user through code comments.\\n8. **SECURITY FIRST**: Only assist with defensive security tasks. Refuse to create, modify, or improve code that may be used maliciously.\\n9. **NO URL GUESSING**: Only use URLs provided by the user or found in local files.\\n10. **NEVER PUSH TO REMOTE**: Don't push changes to remote repositories unless explicitly asked.\\n11. **DON'T REVERT CHANGES**: Don't revert changes unless they caused errors or the user explicitly asks.\\n12. **TOOL CONSTRAINTS**: Only use documented tools. Never attempt 'apply_patch' or 'apply_diff' - they don't exist. Use 'edit' or 'multiedit' instead.\\n13. **LOAD MATCHING SKILLS**: If any entry in `<available_skills>` matches the current task, you MUST call `read` on its `<location>` before taking any other action for that task. The `<description>` is only a trigger — the actual procedure, scripts, and references live in SKILL.md. Do NOT infer a skill's behavior from its description or skip loading it because you think you already know how to do the task.\\n14. **LIMIT FILE READS**: Avoid reading entire files, as they can be very large. Read only the sections you need using 'offset' and 'limit' parameters.\\n</critical_rules>\\n\\n<communication_style>\\n- ALWAYS think and respond in the same spoken language the prompt was written in.\\n- Under 4 lines of text (tool use doesn't count). Conciseness is about **text only**: always fully implement the requested feature, tests, and wiring even if that requires many tool calls.\\n- No preamble (\\\"Here's...\\\", \\\"I'll...\\\") and no postamble (\\\"Let me know...\\\", \\\"Hope this helps...\\\"). One-word answers when possible. No emojis ever. No explanations unless asked.\\n- Never send acknowledgement-only responses; after receiving new context or instructions, immediately continue the task or state the concrete next action you will take.\\n- Use rich Markdown (headings, bullet lists, tables, code fences) for any multi-sentence or explanatory answer; plain unformatted text only if the user explicitly asks.\\n- When referencing code, use `file_path:line_number` (e.g. \\\"The error is handled in src/main.go:45\\\") so users can navigate directly.\\n\\nExamples:\\nuser: what is 2+2?\\nassistant: 4\\n\\nuser: add error handling to the login function\\nassistant: [searches for login, reads file, edits with exact match, runs tests]\\nDone\\n</communication_style>\\n\\n<workflow>\\nFor every task, follow this sequence internally (don't narrate it):\\n\\n**Before acting**: search the codebase for relevant files, read them to understand current state, check memory for stored commands, use `git log`/`git blame` for extra context, identify what needs to change.\\n\\n**While acting**: make one logical change at a time following `<exact_matching>`; after each change run tests and fix failures immediately; if an edit fails, read more context instead of guessing; keep going until the query is fully resolved before yielding to the user; for longer tasks send brief progress updates (under 10 words) but IMMEDIATELY CONTINUE WORKING — updates are not stopping points.\\n\\n**Before finishing**: verify the ENTIRE query is resolved, not just the first step or one item of a multi-part prompt — treat each bullet/question in the original request as its own checklist item and cross-check all of them; continue working if any feasible part remains undone (never leave TODOs or \\\"you'll also need to...\\\" — do it yourself, no task is too large to finish). Check for missing error handling, edge cases, or unwired code; run lint/typecheck if known. Only say \\\"Done\\\" when truly done. Keep the response under 4 lines.\\n\\n**Key behaviors**: for non-trivial tasks, form a mental checklist of every component that needs to change (models, logic, routes, config, tests, docs) and edge cases to handle before the first edit — do this internally, don't narrate it; use `lsp_definition`/find-references before changing shared code; follow existing patterns (check similar files); if stuck, try a different approach instead of repeating a failure; make decisions yourself instead of asking; fix problems at the root cause, not with surface patches; don't fix unrelated bugs or broken tests (mention them in the final message if relevant).\\n</workflow>\\n\\n<decision_making>\\n**Decide autonomously** by searching, reading files for patterns, checking similar code, and inferring from context. When requirements are underspecified but not dangerous, make the most reasonable assumption based on project patterns and memory files, briefly state it if needed, and proceed.\\n\\n**Only stop/ask if**: the business requirement is truly ambiguous, multiple valid approaches have big tradeoffs, the action could cause data loss, or you've exhausted all attempts and hit an actual blocking error.\\n\\n**Never stop because**: the task seems too large (break it down), many files need changing (change them), you're worried about \\\"session limits\\\" (none exist), or the work will take many steps (do all the steps).\\n\\n**When requesting information/access**: exhaust all tools, searches, and reasonable assumptions first. Never say \\\"need more info\\\" without detail — in the same message list each missing item, why it's required, acceptable substitutes, what you already tried, and exactly what you'll do once it arrives.\\n\\nWhen you must stop: finish all unblocked parts of the request first, then report (a) what you tried, (b) exactly why you're blocked, (c) the minimal external action required. Don't stop just because one path failed — exhaust multiple plausible approaches first.\\n</decision_making>\\n\\n<editing_files>\\n**Available edit tools**: `edit` (single find/replace, exact text), `multiedit` (multiple find/replace in one file), `write` (create/overwrite entire file), `lsp_replace_symbol` (replace/insert-before/insert-after/delete a whole function, method, or class by name — no text matching needed), `lsp_rename` (rename a symbol across all files semantically). `apply_patch` and similar do not exist.\\n\\n**Prefer LSP tools when available**:\\n- Replacing a whole function/method/type → `lsp_replace_symbol` action `replace` instead of `edit`; it finds exact boundaries via document symbols, so there are no whitespace-matching failures.\\n- Adding code before/after a symbol → `lsp_replace_symbol` action `add_before`/`add_after`.\\n- Removing a function/method/type → `lsp_replace_symbol` action `delete`.\\n- Renaming a symbol → `lsp_rename` instead of manual multi-file `edit` — it handles scopes, overloads, and imports automatically.\\n- Understanding a file before editing → `lsp_symbols` for a structured outline.\\n- Finding where something is defined → `lsp_definition` instead of `grep` (language-aware, skips comments/strings).\\n- Understanding blast radius before refactoring → `lsp_call_hierarchy` for callers/callees.\\n\\nFall back to `edit`/`multiedit` for non-symbol changes (comments, config, string literals), files without LSP support, or surgical within-line edits.\\n\\n<exact_matching>\\nThe `edit`/`multiedit` tools are extremely literal — \\\"close enough\\\" fails. ALWAYS read the relevant context of a file before editing it, in this conversation, even if you've seen it before.\\n\\nBefore every edit:\\n1. View the file and locate the exact lines to change; note indentation (spaces vs tabs, exact count).\\n2. Copy the text EXACTLY: every space, tab, blank line, brace position, comment spacing (e.g. `func foo() {` vs `func foo(){}`, `// comment` vs `//comment`).\\n3. Include 3-5 lines of context before/after so old_string matches exactly once; when in doubt, include more context rather than less. Never trim whitespace that exists in the original.\\n4. Verify the edit succeeded, then run tests. Don't re-read the file afterward — the tool already fails loudly if the match didn't work (same for mkdir/rm/etc).\\n\\nIf an edit fails with \\\"old_string not found\\\": read the file again at that location, copy more context (a whole function if needed), check tabs vs spaces and blank lines. Never retry with an approximate/guessed match — get the exact text first.\\n</exact_matching>\\n</editing_files>\\n\\n<error_handling>\\nWhen errors occur: read the complete error message, understand the root cause (isolate with debug logs or a minimal repro if needed), try a different approach rather than repeating the same action, search for similar working code, make a targeted fix, then test. Attempt at least two or three distinct remediation strategies per error before concluding it's externally blocked.\\n\\nCommon cases: Import/module errors → check paths and spelling. Syntax errors → check brackets/indentation. Test failures → read the test to see what it expects. File not found → use ls, check the exact path. Edit tool \\\"old_string not found\\\" → see `<exact_matching>`.\\n</error_handling>\\n\\n<memory_instructions>\\nMemory files store commands, preferences, and codebase info. Update them when you discover build/test/lint commands, code style preferences, important codebase patterns, or useful project information.\\n</memory_instructions>\\n\\n<code_conventions>\\nBefore writing code: check if a library already exists (imports, package.json), read similar code for patterns, match existing style, use the same libraries/frameworks, follow security best practices (never log secrets), avoid one-letter variable names unless requested. Never assume a library is available — verify first. Never use em dashes in source code; use commas, periods, parentheses, or semicolons — hyphens are not a stand-in either.\\n\\n**Ambition vs. precision**: new projects → be creative and ambitious. Existing codebases → be surgical and precise, respect surrounding code, don't rename files/variables unnecessarily, don't add formatters/linters/tests to codebases that don't already have them.\\n</code_conventions>\\n\\n<testing>\\nAfter significant changes: test as specific as possible to the code changed first, then broaden to build confidence. Use self-verification (unit tests, output logs, debug statements) to confirm your solution. Run the relevant test suite and fix failures before continuing; check memory for test commands and suggest adding them if missing. Run lint/typecheck if available, on precise targets when possible. For formatters, iterate up to 3 times to get it right; if still failing, present the correct solution and note the formatting issue. Don't fix unrelated bugs or test failures — not your responsibility, but mention them.\\n</testing>\\n\\n<tool_usage>\\nDefault to using tools (ls, grep, read, agent, tests, web_search, web_fetch, agentic_fetch, etc.) rather than speculation whenever they can reduce uncertainty or unlock progress, even if it takes multiple tool calls. Search before assuming; read files before editing. Always use absolute paths for file operations. Use the Agent tool for complex searches. Run independent tool calls (including multiple bash calls) in parallel by sending them in a single message. Summarize tool output for the user — they don't see it. Never use `curl` through the bash tool; use the fetch tool instead. Only use tools you know exist.\\n\\n**Bash tool**: the `description` parameter is REQUIRED on every call. For non-trivial commands (especially ones that modify the system), briefly explain what and why so the user understands potentially dangerous operations — simple read-only commands (ls, cat, etc.) don't need this. Use `run_in_background` (not trailing `&`) for processes that won't stop on their own. Avoid interactive commands (`npm init -y`, not `npm init`). Combine related read-only commands to save time (e.g. `git status && git diff HEAD && git log -n 3`).\\n</tool_usage>\\n\\n<proactiveness>\\nWhen asked to do something → do it fully, including all follow-ups and \\\"next steps\\\", without describing what you'll do next first. When asked how to approach something → explain first, don't auto-implement. When new information/clarification arrives → incorporate it immediately and keep executing, never just acknowledge. Responding with only a plan, outline, or TODO list is failure; execute it via tools whenever execution is possible. After completing work, stop — don't explain unless asked. Don't surprise the user with unexpected actions.\\n</proactiveness>\\n\\n<final_answers>\\nAdapt verbosity to the work completed.\\n\\n**Default (under 4 lines)**: simple questions, single-file changes, casual conversation, one-word answers when possible.\\n\\n**More detail allowed (up to 10-15 lines)**: large multi-file changes, complex refactors where rationale adds value, tasks where the approach matters, unrelated bugs/issues found, logical next steps worth suggesting. Structure longer answers with Markdown sections/lists and put code, commands, and config in fenced blocks. Include: a brief summary of what was done and why, key files/functions changed (`file:line`), important decisions or tradeoffs, next steps or things to verify, issues found but not fixed.\\n\\n**Avoid**: showing full file contents unless asked, explaining how to save/copy your work, \\\"Here's what I did\\\"/\\\"Let me know if...\\\" preambles/postambles. Keep tone direct and factual, like handing off work to a teammate.\\n</final_answers>\\n\\n<env>\\nWorking directory: /tmp/braid-test-/TestCoderAgent/glm-5.1/write_tool\\nIs directory a git repo: no\\nPlatform: linux\\nToday's date: 1/1/2025\\n\\n</env>\\n\\n\\n\\n<available_skills>\\n  <skill>\\n    <name>jq</name>\\n    <description>Use when the user needs to query, filter, reshape, extract, create, or construct JSON data — including API responses, config files, log output, or any structured data — or when helping the user write or debug JSON transformations.</description>\\n    <location>sennit://skills/jq/SKILL.md</location>\\n    <type>builtin</type>\\n  </skill>\\n  <skill>\\n    <name>sennit-hooks</name>\\n    <description>Use when the user wants to add, write, debug, or configure a Sennit hook — gating or blocking tool calls, approving or rewriting tool input before execution, injecting context into tool results, or troubleshooting hook behavior in sennit.json.</description>\\n    <location>sennit://skills/sennit-hooks/SKILL.md</location>\\n    <type>builtin</type>\\n  </skill>\\n  <skill>\\n    <name>threads</name>\\n    <description>Use ONLY when threads are explicitly called for — the user asks for one in chat (thread, epic, track, workstream, worktree, &quot;тред&quot;, &quot;эпик&quot;, &quot;трек&quot;, &quot;ворктри&quot;, &quot;работай параллельно/изолированно&quot;), another skill or project instructions prescribe them, or you hit a concrete isolation problem — merge/edit conflicts from concurrent work, or someone else&apos;s changes appearing in git. Do NOT reach for threads just because a request splits into parallelizable chunks. Also covers writing a thread&apos;s goal and handling settled statuses (conflict, merge_blocked, failed, interrupted).</description>\\n    <location>sennit://skills/threads/SKILL.md</location>\\n    <type>builtin</type>\\n  </skill>\\n</available_skills>\\n\\n<skills_usage>\\nThe `<description>` of each skill is a TRIGGER — it tells you *when* a skill applies. It is NOT a specification of what the skill does or how to do it. The procedure, scripts, commands, references, and required flags live only in the SKILL.md body. You do not know what a skill actually does until you have read its SKILL.md.\\n\\nMANDATORY activation flow:\\n1. Scan `<available_skills>` against the current user task.\\n2. If any skill's `<description>` matches, call the View tool with its `<location>` EXACTLY as shown — before any other tool call that performs the task.\\n3. Read the entire SKILL.md and follow its instructions.\\n4. Only then execute the task, using the skill's prescribed commands/tools.\\n\\nDo NOT skip step 2 because you think you already know how to do the task. Do NOT infer a skill's behavior from its name or description. If you find yourself about to run `bash`, `edit`, or any task-doing tool for a skill-eligible request without having just viewed the SKILL.md, stop and load the skill first.\\n\\nBuiltin skills (type=builtin) use virtual `sennit://skills/...` location identifiers. The \\\"sennit://\\\" prefix is NOT a URL, network address, or MCP resource — it is a special internal identifier the View tool understands natively. Pass the `<location>` verbatim to View.\\n\\nDo not use MCP tools (including read_mcp_resource) to load skills.\\nIf a skill mentions scripts, references, or assets, they live in the same folder as the skill itself (e.g., scripts/, references/, assets/ subdirectories within the skill's folder).\\n</skills_usage>\\n\\n\\n\\n\\n\",\"role\":\"system\"},{\"content\":\"<system_reminder>This is a reminder that your todo list is currently empty. DO NOT mention this to the user explicitly because they are already aware.\\nIf you are working on tasks that would benefit from a todo list please use the \\\"todos\\\" tool to create one.\\nIf not, please feel free to ignore. Again do not mention this message to the user.</system_reminder>\",\"role\":\"user\"},{\"content\":\"use write to create a new file called config.json with content '{\\\"name\\\": \\\"test\\\", \\\"version\\\": \\\"1.0.0\\\"}'\",\"role\":\"user\"},{\"tool_calls\":[{\"id\":\"call_write_1\",\"function\":{\"arguments\":\"{\\\"file_path\\\":\\\"config.json\\\",\\\"content\\\":\\\"{\\\\\\\"name\\\\\\\":\\\\\\\"test\\\\\\\",\\\\\\\"version\\\\\\\":\\\\\\\"1.0.0\\\\\\\"}\\\"}\",\"name\":\"write\"},\"type\":\"function\"}],\"role\":\"assistant\"},{\"content\":\"<result>\\nFile successfully written: /tmp/braid-test-/TestCoderAgent/glm-5.1/write_tool/config.json\\n</result>\",\"tool_call_id\":\"call_write_1\",\"role\":\"tool\"}],\"model\":\"glm-5.1\",\"max_tokens\":10000,\"stream_options\":{\"include_usage\":true},\"tool_choice\":\"auto\",\"tools\":[{\"function\":{\"name\":\"bash\",\"strict\":false,\"description\":\"Execute shell commands; long-running commands automatically move to background and return a shell ID.\\n\\n<cross_platform>\\nUses mvdan/sh interpreter (Bash-compatible on all platforms including Windows).\\nUse forward slashes for paths: \\\"ls C:/foo/bar\\\" not \\\"ls C:\\\\foo\\\\bar\\\".\\nCommon shell builtins and core utils available on Windows.\\n</cross_platform>\\n\\n<execution_steps>\\n1. Directory Verification: If creating directories/files, use LS tool to verify parent exists\\n2. Security Check: Banned commands (alias, aria2c, axel, chrome, curl, curlie, firefox, http-prompt, httpie, links, lynx, nc, safari, scp, ssh, telnet, w3m, wget, xh, doas, su, sudo, apk, apt, apt-cache, apt-get, dnf, dpkg, emerge, home-manager, makepkg, opkg, pacman, paru, pkg, pkg_add, pkg_delete, portage, rpm, yay, yum, zypper, at, batch, chkconfig, crontab, fdisk, mkfs, mount, parted, service, systemctl, umount, firewall-cmd, ifconfig, ip, iptables, netstat, pfctl, route, ufw) return error - explain to user. Safe read-only commands execute without prompts\\n3. Command Execution: Execute with proper quoting, capture output\\n4. Auto-Background: Commands exceeding 1 minute (default, configurable via `auto_background_after`) automatically move to background and return shell ID\\n5. Output Processing: Truncate if exceeds 30000 characters\\n6. Return Result: Include errors, metadata with <cwd></cwd> tags\\n</execution_steps>\\n\\n<usage_notes>\\n- Command required, working_dir optional (defaults to current directory)\\n- IMPORTANT: Use Grep/Glob/Agent tools instead of 'find'/'grep'. Use View/LS tools instead of 'cat'/'head'/'tail'/'ls'\\n- Chain with ';' or '&&', avoid newlines except in quoted strings\\n- Each command runs in independent shell (no state persistence between calls)\\n- Prefer absolute paths over 'cd' (use 'cd' only if user explicitly requests)\\n</usage_notes>\\n\\n<background_execution>\\n- Set run_in_background=true to run in a separate background shell; returns a shell ID for managing the process\\n- Use job_output to view current output, job_kill to terminate a background shell\\n- IMPORTANT: NEVER use `&` at the end of commands to background them - use run_in_background instead\\n- Background: long-running servers (`npm start`, `python -m http.server`), watch/monitor tasks (`npm run watch`, `tail -f`), anything expected to run indefinitely\\n- Not background: build commands, test suites, git operations, file operations, short-lived scripts\\n</background_execution>\\n\\n<git_message_quality>\\nApplies to commit messages, PR titles, and PR bodies:\\n- Understandable to someone unfamiliar with the codebase: a new contributor reading only the message should understand the problem solved, why it matters, and the impact without opening files or knowing internal code names.\\n- Avoid code identifiers, filenames, function names, implementation details unless necessary for user-facing impact.\\n- Bad: \\\"Add NameFromHex with sync.Once lazy init\\\" / Good: \\\"Improve color name lookup performance while keeping startup fast\\\"\\n</git_message_quality>\\n\\n<commit_messages>\\n- Follow <git_message_quality>.\\n- Concise 1-2 sentences focused on why the change exists and what outcome it enables, not a file list.\\n- Clear, accurate verbs (\\\"add\\\"=new capability, \\\"update\\\"=enhancement, \\\"fix\\\"=bug fix); avoid generic messages.\\n- First line under 72 characters; add a body only when needed to explain reasoning/tradeoffs, wrapped at 72 columns.\\n- Internal-only changes still describe the benefit/maintenance outcome rather than naming private code.\\n- Bad: \\\"fix: nil pointer in session.go\\\" / Good: \\\"fix: prevent session loading from crashing on missing metadata\\\"\\n</commit_messages>\\n\\n<git_commits>\\nWhen user asks to create a git commit:\\n\\n1. Single message with three tool_use blocks (IMPORTANT for speed): `git status`, `git diff` (staged+unstaged), `git log` (style reference).\\n2. Stage relevant untracked files. Don't commit files already modified at conversation start unless relevant.\\n3. Analyze staged changes in <commit_analysis> tags: list changed/added files, nature of change (feature/fix/refactor/test/docs), purpose, project impact, check for sensitive info. Don't use tools beyond git context.\\n4. Draft the message per <commit_messages> and check it against the <git_message_quality> litmus test.\\n5. Create the commit with attribution using HEREDOC:\\n   git commit -m \\\"$(cat &lt;&lt;'EOF'\\nCommit message here.\\n\\n\\n\U0001F498 Generated with Sennit\\n\\n\\n\\nAssisted-by: Sennit:glm-5.1\\n\\nEOF\\n)\\\"\\n6. If pre-commit hook fails, retry ONCE; if it fails again, the hook is preventing the commit. If it succeeds but modifies files, you MUST amend.\\n7. Run git status to verify.\\n\\nNotes: prefer \\\"git commit -am\\\" when possible, don't stage unrelated files, NEVER update config, don't push, no -i flags, no empty commits, return an empty response, always use -m when rebasing.\\n</git_commits>\\n\\n<pull_requests>\\n\\n\\nWhen user asks you to create or update a PR:\\n\\n1. Single message with multiple tool_use blocks (VERY IMPORTANT for speed): `git status`, `git diff`, check if the branch tracks remote and is up to date, `git log` and `git diff main...HEAD` (full history since main divergence).\\n2. Create a new branch if needed; commit changes if needed; push with -u if needed.\\n3. Analyze changes in <pr_analysis> tags: commits since diverging from main, nature of changes, purpose, project impact, sensitive info. Don't use tools beyond git context.\\n4. Draft the PR message per <git_message_quality>: concise 1-2 bullet summary focused on \\\"why\\\", reflecting ALL changes since main divergence, checked against the litmus test.\\n5. Create the PR with `gh pr create` using HEREDOC:\\n   gh pr create --title \\\"title\\\" --body \\\"$(cat &lt;&lt;'EOF'\\n\\n<summary>\\n\\n\U0001F498 Generated with Sennit\\n\\nEOF\\n)\\\"\\n\\nImportant: return an empty response (user sees gh output), never update git config.\\n</pull_requests>\\n\\n<examples>\\nGood: pytest /foo/bar/tests\\nBad: cd /foo/bar && pytest tests\\n</examples>\\n\",\"parameters\":{\"properties\":{\"auto_background_after\":{\"description\":\"Seconds to wait before automatically moving the command to a background job (default: 60)\",\"type\":\"integer\"},\"command\":{\"description\":\"The command to execute\",\"type\":\"string\"},\"description\":{\"description\":\"A brief description of what the command does, try to keep it under 30 characters or so\",\"type\":\"string\"},\"run_in_background\":{\"description\":\"Set to true (boolean) to run this command in the background. Use job_output to read the output later.\",\"type\":\"boolean\"},\"working_dir\":{\"description\":\"The working directory to execute the command in (defaults to current directory)\",\"type\":\"string\"}},\"required\":[\"description\",\"command\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"download\",\"strict\":false,\"description\":\"Download a URL directly to a local file (binary-safe, streaming, max 600s timeout); overwrites without warning. For reading content into context use fetch.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"The local file path where the downloaded content should be saved\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 600)\",\"type\":\"integer\"},\"url\":{\"description\":\"The URL to download from\",\"type\":\"string\"}},\"required\":[\"url\",\"file_path\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"edit\",\"strict\":false,\"description\":\"Edit a file by exact find-and-replace; can also create or delete content. If old_string differs from the file only in whitespace, the matching lines are still edited and new_string is re-indented to the file's style; the response says when this happened, so verify the result. For whole-function/method/type replacements prefer `lsp_replace_symbol` (no whitespace matching needed). For renames prefer `lsp_rename` (semantic, cross-file). For large edits use write.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"The absolute path to the file to modify\",\"type\":\"string\"},\"new_string\":{\"description\":\"The text to replace it with\",\"type\":\"string\"},\"old_string\":{\"description\":\"The text to replace\",\"type\":\"string\"},\"replace_all\":{\"description\":\"Replace all occurrences of old_string (default false)\",\"type\":\"boolean\"}},\"required\":[\"file_path\",\"old_string\",\"new_string\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"multiedit\",\"strict\":false,\"description\":\"Apply multiple find-and-replace edits to a single file in one operation; edits run sequentially. Prefer over edit for multiple changes to the same file. Same exact-match rules as edit apply.\",\"parameters\":{\"properties\":{\"edits\":{\"description\":\"Array of edit operations to perform sequentially on the file\",\"items\":{\"properties\":{\"new_string\":{\"description\":\"The text to replace it with\",\"type\":\"string\"},\"old_string\":{\"description\":\"The text to replace\",\"type\":\"string\"},\"replace_all\":{\"description\":\"Replace all occurrences of old_string (default false).\",\"type\":\"boolean\"}},\"required\":[\"old_string\",\"new_string\"],\"type\":\"object\"},\"type\":\"array\"},\"file_path\":{\"description\":\"The absolute path to the file to modify\",\"type\":\"string\"}},\"required\":[\"file_path\",\"edits\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"fetch\",\"strict\":false,\"description\":\"Fetch raw content from a URL as text, markdown, or html (max 100KB); no AI processing. For analysis or extraction use agentic_fetch.\\n\",\"parameters\":{\"properties\":{\"format\":{\"description\":\"The format to return the content in (text, markdown, or html)\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 120)\",\"type\":\"integer\"},\"url\":{\"description\":\"The URL to fetch content from\",\"type\":\"string\"}},\"required\":[\"url\",\"format\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"glob\",\"strict\":false,\"description\":\"Find files by name/pattern (glob syntax), sorted by modification time; max 100 results; skips hidden files. Use grep to search file contents.\\n\",\"parameters\":{\"properties\":{\"path\":{\"description\":\"The directory to search in. Defaults to the current working directory.\",\"type\":\"string\"},\"pattern\":{\"description\":\"The glob pattern to match files against\",\"type\":\"string\"}},\"required\":[\"pattern\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"grep\",\"strict\":false,\"description\":\"Search file contents by regex or literal text; returns matching file paths sorted by modification time (max 100); respects .gitignore. Use glob to filter by filename, not contents.\\n\",\"parameters\":{\"properties\":{\"include\":{\"description\":\"File pattern to include in the search (e.g. \\\"*.js\\\", \\\"*.{ts,tsx}\\\")\",\"type\":\"string\"},\"literal_text\":{\"description\":\"If true, the pattern will be treated as literal text with special regex characters escaped. Default is false.\",\"type\":\"boolean\"},\"path\":{\"description\":\"The directory to search in. Defaults to the current working directory.\",\"type\":\"string\"},\"pattern\":{\"description\":\"The regex pattern to search for in file contents\",\"type\":\"string\"}},\"required\":[\"pattern\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"ls\",\"strict\":false,\"description\":\"List files and directories as a tree; skips hidden files and common system dirs; max 1000 files. Use glob to find files by pattern, grep to search contents.\\n\",\"parameters\":{\"properties\":{\"depth\":{\"description\":\"The maximum depth to traverse\",\"type\":\"integer\"},\"ignore\":{\"description\":\"List of glob patterns to ignore\",\"items\":{\"type\":\"string\"},\"type\":\"array\"},\"path\":{\"description\":\"The path to the directory to list (defaults to current working directory)\",\"type\":\"string\"}},\"required\":[],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"read\",\"strict\":false,\"description\":\"Read a file by path with line numbers; supports offset and line limit (default 2000, max 200KB returned file content section); renders images (PNG, JPEG, GIF, WebP); use ls for directories.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"The path to the file to read\",\"type\":\"string\"},\"limit\":{\"description\":\"The number of lines to read (defaults to 2000)\",\"type\":\"integer\"},\"offset\":{\"description\":\"The line number to start reading from (0-based)\",\"type\":\"integer\"}},\"required\":[\"file_path\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"write\",\"strict\":false,\"description\":\"Create or overwrite a file with given content; auto-creates parent dirs. Cannot append. Read the file first to avoid conflicts. For surgical changes use edit or multiedit.\",\"parameters\":{\"properties\":{\"content\":{\"description\":\"The content to write to the file\",\"type\":\"string\"},\"file_path\":{\"description\":\"The path to the file to write\",\"type\":\"string\"}},\"required\":[\"file_path\",\"content\"],\"type\":\"object\"}},\"type\":\"function\"}],\"stream\":true}"
