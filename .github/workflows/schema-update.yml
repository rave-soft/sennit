name: schema check

on:
  push:
    branches: [main]
    paths:
      - "internal/config/**"
      - "schema.json"
  pull_request:
    paths:
      - "internal/config/**"
      - "schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # schema.json is regenerated locally when config changes (the
      # pre-commit hook keeps the habit honest); CI only verifies it was
      # not forgotten. The previous auto-commit variant pushed to main as
      # a bot, required a PAT secret and ran `go generate` on a package
      # (internal/agent/hyper) removed in the rebrand.
      - name: Check schema.json is up to date
        run: |
          go run . schema > /tmp/schema.json
          diff -u schema.json /tmp/schema.json || {
            echo "::error::schema.json is stale — run 'go run . schema > schema.json' and commit"
            exit 1
          }
