name: nightly

# Manual-only: the reusable nightly workflow publishes via goreleaser-pro
# and needs the GORELEASER_KEY secret this fork does not have. Restore the
# cron trigger once the secret is configured.
on:
  workflow_dispatch:

jobs:
  nightly:
    uses: charmbracelet/meta/.github/workflows/nightly.yml@main
    secrets:
      goreleaser_key: ${{ secrets.GORELEASER_KEY }}
