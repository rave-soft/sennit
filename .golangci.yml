version: "2"
linters:
  # Linters not listed below were considered and rejected.
  enable:
    - bodyclose
    - errorlint
    - goprintffuncname
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - depguard
    - forbidigo
  settings:
    forbidigo:
      forbid:
        # internal/ui/common.Common.Context() carries the TUI's lifecycle
        # context, cancelled on shutdown. context.Background()/TODO() in
        # its place is invisible to that cancellation: an in-flight
        # workspace call (most concretely, an OAuth device-flow poll)
        # keeps running after the user quits. Scoped to internal/ui below
        # via exclusions.rules' path-except — this pattern is fine
        # anywhere else, including common.go's own fallback inside
        # Context() and the one documented exception in oauth_codex.go
        # (both carry a //nolint:forbidigo with their reasoning).
        - pattern: '^context\.Background$'
          msg: "use common.Common.Context() instead of context.Background() so workspace calls are cancelled when the TUI shuts down; see internal/ui/common/common.go"
        - pattern: '^context\.TODO$'
          msg: "use common.Common.Context() instead of context.TODO() so workspace calls are cancelled when the TUI shuts down; see internal/ui/common/common.go"
      exclude-godoc-examples: true
    depguard:
      rules:
        # C3 UI boundary inventory/rationale: the deny-list forbids orchestration and
        # runtime packages (agent, thread, db, app). Remaining domain imports in
        # internal/ui are allowed only as event/DTO contracts; all domain operations
        # must go through the Workspace facade, never called directly.
        ui-boundary:
          files:
            - "**/internal/ui/**/*.go"
          deny:
            - pkg: github.com/rave-soft/sennit/internal/agent
            - pkg: github.com/rave-soft/sennit/internal/thread
            - pkg: github.com/rave-soft/sennit/internal/db
            - pkg: github.com/rave-soft/sennit/internal/app
  disable:
    # Disabled since this config was inherited wholesale from the upstream
    # Crush/Braid config; no rationale for disabling it is on record.
    - ineffassign
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    paths:
      # Git worktrees created inside the repo: Claude Code puts them in
      # .claude/worktrees/, and a thread's own worktree lives in
      # .sennit/threads/ (see thread.ManagerOptions.WorktreeDir). Go's own
      # tooling skips dot-directories, so `go build ./...` never sees
      # them, but golangci-lint does: it would lint a second copy of
      # every package — on another branch, often deliberately
      # mid-refactor — report issues against paths that vanish when the
      # worktree is removed, and poison its cache with them.
      - '\.claude/'
      - '\.sennit/'
    rules:
      # forbidigo's context.Background()/TODO() ban above only makes sense
      # against internal/ui's own lifecycle context — everywhere else
      # (agent, workspace, cmd, ...) context.Background() is the ordinary,
      # correct way to start a root context, so the rule is scoped off
      # everywhere but internal/ui rather than applied repo-wide.
      - path-except: 'internal/ui/'
        linters:
          - forbidigo
      # Tests build a *common.Common directly (there is no running TUI, so
      # no lifecycle context to inherit) and context.Background() is the
      # right, ordinary choice there — the same case common.go's own
      # Context() fallback documents.
      - path: '_test\.go'
        linters:
          - forbidigo
      - path: internal/shell/run.go
        text: "SA1019.*interp.ExecHandler"
        linters:
          - staticcheck
      - text: 'Error return value of `.*\.Close` is not checked'
        linters:
          - errcheck
      - text: 'Error return value of `fmt\.Fprint'
        linters:
          - errcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - '\.claude/'
      - '\.sennit/'
