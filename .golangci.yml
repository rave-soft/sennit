version: "2"
linters:
  enable:
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    - unparam
    - whitespace
    # - wrapcheck
  disable:
    - ineffassign
    - unused
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    paths:
      # Git worktrees created inside the repo (Claude Code puts them in
      # .claude/worktrees/). Go's own tooling skips dot-directories, so
      # `go build ./...` never sees them, but golangci-lint does: it
      # would lint a second copy of every package, report issues against
      # paths that vanish when the worktree is removed, and poison its
      # cache with them.
      - '\.claude/'
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - path: internal/shell/run.go
        text: "SA1019.*interp.ExecHandler"
        linters:
          - staticcheck
      - text: 'Error return value of `.*\.Close` is not checked'
        linters:
          - errcheck
      - text: 'Error return value of `fmt\.Fprint'
        linters:
          - errcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - '\.claude/'
